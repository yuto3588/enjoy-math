<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Enjoy数学</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">

<!-- ホーム画面から開いたとき全画面にする（iOS 16 以前はこの指定を見る） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Enjoy数学">
<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#faf6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1815" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="app">

  <!-- 学年えらび（この端末を誰が使うか。初回だけ出る） -->
  <section class="screen" id="screen-grade">
    <div class="home">
      <p class="ask">学年は？</p>
      <div class="grades" id="grades"></div>
    </div>
  </section>

  <!-- ホーム画面 -->
  <section class="screen" id="screen-home">
    <div class="home">
      <button type="button" class="grade-tag" id="gradeTag"></button>
      <p class="ask">今日は何分やる？</p>
      <div class="times">
        <button type="button" class="time" data-min="10">10<span>分</span></button>
        <button type="button" class="time" data-min="30">30<span>分</span></button>
        <button type="button" class="time" data-min="60">60<span>分</span></button>
      </div>
      <p class="carry" id="carryNote"></p>
    </div>
  </section>

  <!-- 問題画面 -->
  <section class="screen" id="screen-practice">
    <div class="topbar">
      <div class="topbar-row">
        <span class="remain" id="remain"></span>
        <span class="spacer"></span>
        <button type="button" class="link" id="pauseBtn">休憩</button>
        <button type="button" class="link" id="quitBtn">やめる</button>
      </div>
      <div class="progress"><i id="progressFill"></i></div>
    </div>

    <div class="stage" id="stage">
      <div class="question" id="question"></div>
      <div class="answer" id="answerBox"></div>
      <div class="tick" id="tick" aria-hidden="true">✓</div>
    </div>

    <div class="keypad" id="keypad"></div>
  </section>

  <!-- 終了画面 -->
  <section class="screen" id="screen-done">
    <div class="done">
      <h1>今日の分、終わり！</h1>
      <div class="dots" id="doneDots" aria-hidden="true"></div>
      <p id="doneCount"></p>
      <p class="done-note" id="doneNote">今日も開いたね</p>
      <button type="button" class="wide ghost" id="homeBtn">ホームへ</button>
    </div>
  </section>

</div>

<!-- 解説・持ち越しの全面パネル -->
<div class="explain" id="overlay">
  <div class="explain-body">
    <div class="expr" id="overlayExpr"></div>
    <ol class="steps" id="overlayLines"></ol>
  </div>
  <button type="button" class="wide" id="overlayBtn">わかった</button>
</div>

<!-- 休憩中のパネル -->
<div class="pause" id="pausePanel">
  <p class="pause-title">休憩中</p>
  <div class="pause-actions">
    <button type="button" class="wide" id="resumeBtn">つづける</button>
    <button type="button" class="wide ghost" id="quitFromPauseBtn">やめる</button>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
